# The smallest config that works: one layer from a repository, one directory
# this machine keeps for itself.  Precedence runs top to bottom, so local wins
# any file both layers provide.
#
#     name    path              url
#
# path is relative to ~/.dotfiles.  url is the clone source for the FIRST path
# component — the clone root — so this clones the repository to
# ~/.dotfiles/personal and uses the base directory inside it as the layer.
# Name the clone root itself as the layer instead and everything the repository
# keeps for its own sake is linked into your home directory: .gitignore,
# .github, docs, Makefile, CONTRIBUTING.md.  Shale leaves out .git, README,
# LICENSE and COPYING and nothing else; the subdirectory is what keeps the rest
# out.

base    personal/base     https://github.com/you/dotfiles.git
local   local

# ~/.dotfiles/local has no url on purpose — it is this machine's own directory.
# Create it before the first apply:  mkdir -p ~/.dotfiles/local
#
# See wsl-work.conf for the rest of the format: several layers from one clone,
# and a second repository on a second account.
